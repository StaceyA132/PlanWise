spring.application.name=planwise

# APR (as a percent) for the monthly plan options
planwise.apr.six-month=10.00
planwise.apr.twelve-month=15.00

# Database. Defaults match docker-compose.yml; override with environment variables elsewhere.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/planwise}
spring.datasource.username=${DB_USERNAME:planwise}
spring.datasource.password=${DB_PASSWORD:planwise}

# Flyway creates the tables from src/main/resources/db/migration.
# Hibernate only checks that the entity classes match them; it never changes the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT signing secret: at least 32 characters, from the JWT_SECRET environment variable.
# If it is not set, a random secret is generated at startup (tokens stop working after a restart).
planwise.jwt.secret=${JWT_SECRET:}
planwise.jwt.expiration=PT1H
